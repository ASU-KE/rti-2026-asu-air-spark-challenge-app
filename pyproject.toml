[project]
name = "airgents-backend"
version = "0.1.0"
description = "AIRgents of Change — FastAPI backend for networked persona-based LLM agent experiments"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
]

[tool.uv]
# The backend is an application, not a distributable library, so uv does not
# build and install it into the environment; tests import it via pythonpath.
package = false

[tool.pytest.ini_options]
pythonpath = ["backend-app"]
testpaths = ["backend-app/tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["backend-app"]
strict = true
